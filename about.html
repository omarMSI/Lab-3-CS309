<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Omar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Omar</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html" class="active">About</a>
            <a href="component.html">Components</a>
            <a href="validation.html">Register</a>
            <a href="data.html">Data Table</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle-btn">🌙 Dark Mode</button>
    </header>

    <main class="container">
        <section>
            <h2>About Me</h2>

            <form>
                <div class="form-field">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name">
                </div>

                <div class="form-field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>

                <div class="form-field">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" placeholder="Enter your age">
                </div>

                <div class="form-field">
                    <label for="date">Date of Birth:</label>
                    <input type="date" id="date" name="date">
                </div>

                <div class="form-field">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </div>
                </div>

                <div class="form-field">
                    <label>My Interests:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="programming" name="interest" value="programming">
                        <label for="programming">Programming</label>
                        <input type="checkbox" id="web" name="interest" value="web">
                        <label for="web">Web Development</label>
                        <input type="checkbox" id="database" name="interest" value="database">
                        <label for="database">Database</label>
                    </div>
                </div>

                <div class="form-field">
                    <label for="course">Choose Your Course:</label>
                    <select id="course" name="course">
                        <option value="">Select a course</option>
                        <option value="java">Java</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="database">Database</option>
                        <option value="algorithm">Algorithm</option>
                        <option value="data-structure">Data Structure</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="message">Tell Me About Yourself:</label>
                    <textarea id="message" name="message" rows="6" placeholder="Write something about yourself..."></textarea>
                </div>

                <button type="submit" class="btn">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Omar. All Rights Reserved.</p>
    </footer>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️ Light Mode';
        }
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggleBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
        });
    </script>
</body>

</html>
